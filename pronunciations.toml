# 2. Безопасные словарные правила (имена и авторские термины)
# Демидович -> Дем+идович
"Демидович" = "Дем+идович"
"Демидовича" = "Дем+идовича"
"Демидовичу" = "Дем+идовичу"
"Демидовичем" = "Дем+идовичем"
"Демидовиче" = "Дем+идовиче"

# Паша -> П+аша
"Паша" = "П+аша"
"Паши" = "П+аши"
"Паше" = "П+аше"
"Пашу" = "П+ашу"
"Пашей" = "П+ашей"
"Пашею" = "П+ашею"

# клановка -> кл+ановка
"клановка" = "кл+ановка"
"клановки" = "кл+ановки"
"клановке" = "кл+ановке"
"клановку" = "кл+ановку"
"клановкой" = "кл+ановкой"
"клановкам" = "кл+ановкам"
"клановках" = "кл+ановках"

# ястребами -> +ястребами
"ястребами" = "+ястребами"
"ястребов" = "+ястребов"
"ястребы" = "+ястребы"

# 3. Контекстные / фразовые правила для Книги 7
"большая часть" = "больш+ая часть"
"подаст руки" = "подаст рук+и"
"без всяких эмоций предельно формально начала Юсупова" = "без всяких эмоций предельно формально начал+а Юсупова"
"формально начала Юсупова" = "формально начал+а Юсупова"
"начала Юсупова" = "начал+а Юсупова"
"начала Вика" = "начал+а Вика"
"в его словах" = "в его слов+ах"
"приложил сил к тому" = "приложил сил к том+у"
"приложил к тому" = "приложил к том+у"
"к тому, чтобы" = "к том+у, чтобы"
"так и малое дофига" = "так и м+алое дофига"
"малое дофига" = "м+алое дофига"
"второй технический кандидат" = "втор+ой технический кандидат"

# 4. Подтверждённые контекстные ударения
# Попадало неоднозначно: поп+адало (падало) / попад+ало (соответствовало).
"под это определение не попадало" = "под это определение не попад+ало"
# Боли неоднозначно: б+оли (существительное) / бол+и (повелительное наклонение).
"испугался он явно не боли" = "испугался он явно не б+оли"
# Родительный падеж после глагола пить: вод+ы; не множественное в+оды.
"глотнув воды" = "глотнув вод+ы"
"глотнуть воды" = "глотнуть вод+ы"
"вкусной воды" = "вкусной вод+ы"
# У существительного «заморозка» ударение во всех найденных контекстах однозначно.
"заморозки" = "замор+озки"

