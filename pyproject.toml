[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-v2-audio"
version = "0.2.0"
description = "FB2 → audiobook with AI-powered Porfiry commentary"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}

authors = [
    {name = "Audiobook Generator Team"},
]

keywords = [
    "audiobook",
    "tts",
    "fb2",
    "piper-tts",
    "edge-tts",
    "porfiry",
    "text-to-speech",
    "audiobook-generator",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "customtkinter==6.0.0",
    "defusedxml==0.7.1",
    "httpx==0.28.1",
    "edge-tts==7.2.8",
    "keyring==25.7.0",
    "tomli-w==1.2.0",
    "spacy==3.8.14",
    "Pillow==12.3.0",
    "cryptography==49.0.0",
    "click==8.4.2",
]

[project.optional-dependencies]
supertonic = [
    "supertonic>=1.0.0",
]
silero = [
    "silero-tts==0.0.5",
    "scipy==1.18.0",
    "torch==2.13.0",
    "torchaudio==2.11.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pyinstaller>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.png", "*.ico"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
